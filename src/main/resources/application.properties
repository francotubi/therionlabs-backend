spring.application.name=therionlabs-backend
spring.datasource.url=${THERIONLABS_DB_URL:jdbc:mysql://localhost:3306/therionlabs_db}
spring.datasource.username=${THERIONLABS_DB_USER:therionlabs_user}
spring.datasource.password=${THERIONLABS_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
server.port=${PORT:8081}
server.error.include-message=always
server.error.include-stacktrace=never
